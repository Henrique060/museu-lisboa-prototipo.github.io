<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v7.0.0/dist/aframe-extras.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  </head>
  <body>

    <style>
      #overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.8); z-index: 9999;
        display: flex; justify-content: center; align-items: center;
      }
      #overlay button { padding: 20px; font-size: 20px; cursor: pointer; }
    </style>


    <div id="overlay">
      <button id="startButton">Click to Start AR & Video</button>
    </div>

    <a-scene 
        mindar-image="imageTargetSrc: ./public/markers/targets.mind; maxTrack:3; uiScanning: #scanning-overlay; filterMinCF:0.001; filterBeta:0.01; missTolerance: 1; 
        warmupTolerance: 5;
        getMediaConstraints: {audio: false, video: { facingMode: 'environment', zoom: 1.0, width: {ideal: 1280}, height: {ideal: 720} }};" 
        color-space="sRGB" 
        renderer="colorManagement: true, physicallyCorrectLights" 
        vr-mode-ui="enabled: false" 
        device-orientation-permission-ui="enabled: false">
      <a-assets>
        <a-asset-item id="numberMark1" src="./public/models/numberMark1.glb"></a-asset-item>
        <a-asset-item id="numberMark2" src="./public/models/numberMark2.glb"></a-asset-item>
        <a-asset-item id="numberMark3" src="./public/models/numberMark3.glb"></a-asset-item>
        <a-asset-item id="vaseModel" src="./public/models/vase.glb"></a-asset-item>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false">
        <a-cursor raycaster="objects: .clickable" ray-origin="mouse" fuse="false"></a-cursor>
      </a-camera>

      <a-entity mindar-image-target="targetIndex: 0" id="marker1">
        <a-box id="clickTarget" 
                class="clickable" 
                position="0 0 0" 
                scale="0.7 0.7 0.7" 
                material="opacity: 0; transparent: true">
        </a-box>

        <a-gltf-model src="#numberMark1" 
                      id="model1"
                        rotation="180 0 0" 
                        position="0 0 0" 
                        scale="0.4 0.4 0.4">
        </a-gltf-model>
       </a-entity>
      
      <a-entity mindar-image-target="targetIndex: 1">
        <a-gltf-model rotation="0 0 0 " position="0 0 0" scale="0.4 0.4 0.4" src="#numberMark2" >
        </a-gltf-model>
      </a-entity>

      <a-entity mindar-image-target="targetIndex: 2">
       <a-gltf-model rotation="0 0 0 " position="0 0 0" scale="0.4 0.4 0.4" src="#numberMark3" ></a-gltf-model>
      </a-entity>
    </a-scene>



   <script>
const clickTarget = document.querySelector('#clickTarget');
const marker1 = document.querySelector('#marker1');
const startButton = document.querySelector('#startButton');
const overlay = document.querySelector('#overlay');
const marker1Mesh = document.querySelector('#model1')

startButton.addEventListener('click', () => {
  overlay.style.display = 'none';
  console.log("AR Scene Active");
});

clickTarget.addEventListener('click', () => {
  console.log("Hitbox tapped!");
  
  const existingVase = document.querySelector('#spawnedVase');

  if (existingVase) {
    // Branch A: Vase exists, so we REMOVE it and SHOW the marker
    existingVase.remove();
    marker1Mesh.setAttribute('visible', 'true');
    console.log("Vase removed, marker shown");
  } else {
    // Branch B: Vase doesn't exist, so we CREATE it and HIDE the marker
    const vase = document.createElement('a-gltf-model');
    vase.setAttribute('id', 'spawnedVase');
    vase.setAttribute('src', '#vaseModel');
    vase.setAttribute('position', '0 0 0');
    vase.setAttribute('rotation', '90 0 0'); // Fix vase rotation too!
    vase.setAttribute('scale', '0.5 0.5 0.5');
    
    marker1.appendChild(vase);
    marker1Mesh.setAttribute('visible', 'false');
    console.log("Vase spawned, marker hidden");
  }
});

</script>



  </body>
</html>
