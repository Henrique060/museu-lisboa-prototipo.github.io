<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v7.0.0/dist/aframe-extras.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  </head>
  <body>

    <style>
      #overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.8); z-index: 9999;
        display: flex; justify-content: center; align-items: center;
      }
      #overlay button { padding: 20px; font-size: 20px; cursor: pointer; }
    </style>


    <div id="overlay">
      <button id="startButton">Click to Start AR & Video</button>
    </div>

    <a-scene mindar-image="imageTargetSrc: ./public/markers/targets.mind; maxTrack:3;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      <a-assets>
        <a-asset-item id="numberMark1" src="./public/models/numberMark1.glb"></a-asset-item>
        <a-asset-item id="numberMark2" src="./public/models/numberMark2.glb"></a-asset-item>
        <a-asset-item id="numberMark3" src="./public/models/numberMark3.glb"></a-asset-item>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        <a-gltf-model rotation="0 0 0 " position="0 0 0" scale="0.04 0.04 0.04" src="#numberMark1" >
        </a-gltf-model>
      </a-entity>
      
      <a-entity mindar-image-target="targetIndex: 1">
        <a-gltf-model rotation="0 0 0 " position="0 0 0" scale="0.04 0.04 0.04" src="#numberMark2" >
        </a-gltf-model>
      </a-entity>

      <a-entity mindar-image-target="targetIndex: 2">
       <a-gltf-model rotation="0 0 0 " position="0 0 0" scale="0.04 0.04 0.04" src="#numberMark3" ></a-gltf-model>
      </a-entity>

    </a-scene>



    <script>
  let btnClicked = false;
  const startButton = document.querySelector('#startButton');
  const overlay = document.querySelector('#overlay');

  startButton.addEventListener('click', () => {
    // Hide the overlay
    overlay.style.display = 'none';
    btnClicked = true;
   
  });
  if(btnClicked){
        startButton.style.display = 'none';
  }
  

  
</script>



  </body>
</html>
