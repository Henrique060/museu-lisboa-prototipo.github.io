<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>

<body>

<style>
#overlay {
  position: fixed;
  top:0; left:0;
  width:100%; height:100%;
  background: rgba(0,0,0,0.8);
  z-index:9999;
  display:flex;
  justify-content:center;
  align-items:center;
}
</style>

<div id="overlay">
  <button id="startButton">Start AR</button>
</div>

<a-scene 
  mindar-image="imageTargetSrc: ./public/markers/targets.mind; maxTrack: 3"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false"
  renderer="colorManagement: true"
>

<a-assets>
  <a-asset-item id="m1" src="./public/models/numberMark1.glb"></a-asset-item>
  <a-asset-item id="m2" src="./public/models/numberMark2.glb"></a-asset-item>
  <a-asset-item id="m3" src="./public/models/numberMark3.glb"></a-asset-item>
  <a-asset-item id="vase" src="./public/models/vase.glb"></a-asset-item>
</a-assets>

<a-camera position="0 0 0" look-controls="enabled:false"></a-camera>

<!-- MARKER 1 -->
<a-entity mindar-image-target="targetIndex: 0" id="marker1">
  <a-gltf-model id="model1" src="#m1" scale="0.5 0.5 0.5"></a-gltf-model>
  <a-gltf-model id="vase1" src="#vase" visible="false" scale="0.8 0.8 0.8"></a-gltf-model>
</a-entity>

<!-- MARKER 2 -->
<a-entity mindar-image-target="targetIndex: 1" id="marker2">
  <a-gltf-model id="model2" src="#m2" scale="0.5 0.5 0.5"></a-gltf-model>
  <a-gltf-model id="vase2" src="#vase" visible="false" scale="0.8 0.8 0.8"></a-gltf-model>
</a-entity>

<!-- MARKER 3 -->
<a-entity mindar-image-target="targetIndex: 2" id="marker3">
  <a-gltf-model id="model3" src="#m3" scale="0.5 0.5 0.5"></a-gltf-model>
  <a-gltf-model id="vase3" src="#vase" visible="false" scale="0.8 0.8 0.8"></a-gltf-model>
</a-entity>

</a-scene>

<script>
const overlay = document.querySelector("#overlay");
const startButton = document.querySelector("#startButton");

startButton.addEventListener("click", () => {
  overlay.style.display = "none";
  overlay.style.pointerEvents = "none";
});

// -------- SCREEN SPACE TAP DETECTION --------

function getScreenPosition(obj, camera) {
  const vector = new THREE.Vector3();
  obj.object3D.getWorldPosition(vector);
  vector.project(camera);

  return {
    x: (vector.x * 0.5 + 0.5) * window.innerWidth,
    y: (-vector.y * 0.5 + 0.5) * window.innerHeight
  };
}

function setupMarker(markerId, modelId, vaseId) {
  const marker = document.querySelector(markerId);
  const model = document.querySelector(modelId);
  const vase = document.querySelector(vaseId);

  let active = false;

  document.body.addEventListener("click", (e) => {
    if (!marker.object3D.visible) return;

    const cam = document.querySelector("[camera]").getObject3D("camera");

    const pos = getScreenPosition(model, cam);

    const dx = e.clientX - pos.x;
    const dy = e.clientY - pos.y;
    const distance = Math.sqrt(dx*dx + dy*dy);

    // 👇 Tap threshold (increase if needed)
    if (distance < 120) {
      active = !active;

      // animation
      if (active) {
        model.setAttribute("visible", false);
        vase.setAttribute("visible", true);

        vase.setAttribute("animation", {
          property: "scale",
          from: "0 0 0",
          to: "0.8 0.8 0.8",
          dur: 300,
          easing: "easeOutBack"
        });

      } else {
        vase.setAttribute("visible", false);
        model.setAttribute("visible", true);
      }
    }
  });
}

// INIT
setupMarker("#marker1", "#model1", "#vase1");
setupMarker("#marker2", "#model2", "#vase2");
setupMarker("#marker3", "#model3", "#vase3");

</script>

</body>
</html>
