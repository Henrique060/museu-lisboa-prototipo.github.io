<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v7.0.0/dist/aframe-extras.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  </head>
  <body>

    <style>
      #overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.8); z-index: 9999;
        display: flex; justify-content: center; align-items: center;
      }
      #overlay button { padding: 20px; font-size: 20px; cursor: pointer; }
    </style>


    <div id="overlay">
      <button id="startButton">Click to Start AR & Video</button>
    </div>

    <a-scene 
    cursor="rayOrigin: screen"    
    mindar-image="imageTargetSrc: ./public/markers/targets.mind; maxTrack:3; uiScanning: #scanning-overlay; filterMinCF:0.001; filterBeta:0.01; missTolerance: 1; 
        warmupTolerance: 5;
        getMediaConstraints: {audio: false, video: { facingMode: 'environment', zoom: 1.0, width: {ideal: 1280}, height: {ideal: 720} }};" 
        color-space="sRGB" 
        renderer="colorManagement: true, physicallyCorrectLights" 
        vr-mode-ui="enabled: false" 
        device-orientation-permission-ui="enabled: false">
      <a-assets>
        <a-asset-item id="numberMark1" src="./public/models/numberMark1.glb"></a-asset-item>
        <a-asset-item id="numberMark2" src="./public/models/numberMark2.glb"></a-asset-item>
        <a-asset-item id="numberMark3" src="./public/models/numberMark3.glb"></a-asset-item>
        <a-asset-item id="vaseModel" src="./public/models/vase.glb"></a-asset-item>
      </a-assets>

      <a-text id="debugText"
            value="waiting..."
            position="0 0.5 0"
            scale="0.5 0.5 0.5"
            color="yellow">
        </a-text>

      <a-camera position="0 0 0" look-controls="enabled: false">
      </a-camera>

      <a-entity mindar-image-target="targetIndex: 0" id="marker1">
        <a-box id="clickableBox1" class="clickable" position="0 0 0" scale="1 1 1" material="opacity: 0.2; transparent: true"></a-box>
        <a-gltf-model 
                id="model1"
                src="#numberMark1" 
                rotation="0 0 0" 
                position="0 0 0" 
                scale="1 1 1">
                </a-gltf-model>
        
        
       </a-entity>
      
      <a-entity mindar-image-target="targetIndex: 1">
        <a-gltf-model rotation="0 0 0 " position="0 0 0" scale="0.3 0.3 0.3" src="#numberMark2" >
        </a-gltf-model>
      </a-entity>

      <a-entity mindar-image-target="targetIndex: 2">
       <a-gltf-model rotation="0 0 0 " position="0 0 0" scale="0.3 0.3 0.3" src="#numberMark3" ></a-gltf-model>
      </a-entity>
    </a-scene>



   <script>
const marker1 = document.querySelector('#marker1'); // para root em spawn do modelo novo ao clicar 
const startButton = document.querySelector('#startButton'); //começar a exp de AR 
const overlay = document.querySelector('#overlay'); //overlay AR 
const marker1Mesh = document.querySelector('#model1') // modelo 3D do marcador 1
const bboxMarker1 = document.querySelector('#clickableBox1')
const debugText = document.querySelector('#debugText');

startButton.addEventListener('touchstart', () => { //começar a experiencia
  overlay.style.display = 'none';
  overlay.style.pointerEvents = 'none'; // extra add to remove 
  console.log("AR Scene Active");
});


bboxMarker1.addEventListener('click', () => {
  console.log("Hitbox tapped!");
  
  const existing = document.querySelector('#spawnedVase');
  if (existing) {
    existing.remove();
    marker1Mesh.setAttribute('visible', 'true');
    debugText.setAttribute('value', 'REMOVED VASE');
    return;
  }

  marker1Mesh.setAttribute('visible', 'false');
  const vase = document.createElement('a-gltf-model');
  vase.setAttribute('id', 'spawnedVase');
  vase.setAttribute('src', '#vaseModel');
  vase.setAttribute('position', '0 0 0'); // Lifted slightly
  vase.setAttribute('scale', '1 1 1');
  
  marker1.appendChild(vase);
  debugText.setAttribute('value', 'SPAWNED VASE');
});

</script>



  </body>
</html>
