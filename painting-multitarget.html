<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>

<body>

<style>
#overlay {
  position: fixed;
  top:0; left:0;
  width:100%; height:100%;
  background: rgba(0,0,0,0.8);
  z-index:9999;
  display:flex;
  justify-content:center;
  align-items:center;
}
</style>

<div id="overlay">
  <button id="startButton">Start AR</button>
</div>

<a-scene 
  cursor="rayOrigin: screen"
  raycaster="objects: .clickable; far: 10000"
  mindar-image="imageTargetSrc: ./public/markers/targets.mind; maxTrack: 3"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false"
>

<a-assets>
  <a-asset-item id="m1" src="./public/models/numberMark1.glb"></a-asset-item>
  <a-asset-item id="m2" src="./public/models/numberMark2.glb"></a-asset-item>
  <a-asset-item id="m3" src="./public/models/numberMark3.glb"></a-asset-item>
  <a-asset-item id="vase" src="./public/models/vase.glb"></a-asset-item>
</a-assets>

<a-camera position="0 0 0" look-controls="enabled:false"></a-camera>

<!-- MARKER 1 -->
<a-entity mindar-image-target="targetIndex: 0" id="marker1">
  <a-gltf-model class="clickable markerModel"
    id="model1"
    src="#m1"
    scale="0.3 0.3 0.3">
  </a-gltf-model>

  <a-gltf-model 
    id="vase1"
    src="#vase"
    visible="false"
    scale="0.5 0.5 0.5">
  </a-gltf-model>
</a-entity>

<!-- MARKER 2 -->
<a-entity mindar-image-target="targetIndex: 1" id="marker2">
  <a-gltf-model class="clickable markerModel"
    id="model2"
    src="#m2"
    scale="0.3 0.3 0.3">
  </a-gltf-model>

  <a-gltf-model 
    id="vase2"
    src="#vase"
    visible="false"
    scale="0.5 0.5 0.5">
  </a-gltf-model>
</a-entity>

<!-- MARKER 3 -->
<a-entity mindar-image-target="targetIndex: 2" id="marker3">
  <a-gltf-model class="clickable markerModel"
    id="model3"
    src="#m3"
    scale="0.3 0.3 0.3">
  </a-gltf-model>

  <a-gltf-model 
    id="vase3"
    src="#vase"
    visible="false"
    scale="0.5 0.5 0.5">
  </a-gltf-model>
</a-entity>

</a-scene>

<script>
const overlay = document.querySelector("#overlay");
const startButton = document.querySelector("#startButton");

startButton.addEventListener("click", () => {
  overlay.style.display = "none";
  overlay.style.pointerEvents = "none";
});

// HANDLE ALL MARKERS
function setupInteraction(markerId, modelId, vaseId) {
  const marker = document.querySelector(markerId);
  const model = document.querySelector(modelId);
  const vase = document.querySelector(vaseId);

  let active = false;

  model.addEventListener("click", () => {
    if (!marker.object3D.visible) return; // only when tracked

    active = !active;

    model.setAttribute("visible", !active);
    vase.setAttribute("visible", active);
  });
}

// INIT
setupInteraction("#marker1", "#model1", "#vase1");
setupInteraction("#marker2", "#model2", "#vase2");
setupInteraction("#marker3", "#model3", "#vase3");

</script>

</body>
</html>
