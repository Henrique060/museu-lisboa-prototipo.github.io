<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    </head>

<body>
    <a-scene
      mindar-image="imageTargetSrc: ./public/markers/dJoao-target.mind;"
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false">

      <a-assets>
        <a-asset-item id="gem" src="./public/models/gema.glb"></a-asset-item>
        <a-asset-item id="silver" src="./public/models/prata.glb"></a-asset-item>
        <a-asset-item id="gold" src="./public/models/ouro.glb"></a-asset-item>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false" cursor="fuse: false; rayOrigin: mouse;" raycaster="far: ${customFields.libVersion}; objects: .clickable"></a-camera>
        <a-entity mindar-image-target="targetIndex:0" id="target">
            <a-entity gltf-model="#gem" scale=".5 .5 .5" position="1 0 0" class="clickable"></a-entity>
            <a-entity gltf-model="#sixwlver" scale=".5 .5 .5" position="0 1 0"></a-entity>
            <a-entity gltf-model="#gold" scale=".5 .5 .5" position="-1 0 0"></a-entity>
        </a-entity>
    </a-scene>

    <script>
        const gem = document.querySelector('#gem');
        const silver = document.querySelector('#silver');
        const gold = document.querySelector('#gold');

        // touch gem
        gem.addEventListener('click', () => {
            // make gem float to 0 0 0
            gem.setAttribute('animation', 'property: position; to: 0 0 0; dur: 1000; easing: easeInOutQuad');
        });
    </script>
</body>
</html>
