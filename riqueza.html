<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    </head>

<body>
    <a-scene
      mindar-image="imageTargetSrc: ./public/markers/js-prototipo.mind;"
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false">

      <a-assets>
        <a-asset-item id="gem" src="./public/models/gema.glb"></a-asset-item>
        <a-asset-item id="silver" src="./public/models/barra-prata.glb"></a-asset-item>
        <a-asset-item id="gold" src="./public/models/barra-ouro.glb"></a-asset-item>
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
        <a-entity mindar-image-target="targetIndex:0" id="target">
            <a-entity gltf-model="#gem" scale="1 1 1"></a-entity>
            <a-entity gltf-model="#silver" scale="1 1 1"></a-entity>
            <a-entity gltf-model="#gold" scale="1 1 1"></a-entity>
        </a-entity>
      </a-assets>
    </a-scene>
</body>
</html>
