<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>
<body style="margin:0;overflow:hidden;">

<a-scene
  id="scene"
  mindar-image="imageTargetSrc: ./public/markers/dJoao-target.mind;"
  color-space="sRGB"
  renderer="colorManagement: true, physicallyCorrectLights"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-assets>
    <a-asset-item id="gem"    src="./public/models/gema.glb"></a-asset-item>
    <a-asset-item id="silver" src="./public/models/prata.glb"></a-asset-item>
    <a-asset-item id="gold"   src="./public/models/ouro.glb"></a-asset-item>
  </a-assets>

  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

  <a-entity mindar-image-target="targetIndex:0">
    <a-entity id="gem-entity"    gltf-model="#gem"    scale=".5 .5 .5" position="1 0 0"></a-entity>
    <a-entity id="silver-entity" gltf-model="#silver" scale=".5 .5 .5" position="0 1 0"></a-entity>
    <a-entity id="gold-entity"   gltf-model="#gold"   scale=".5 .5 .5" position="-1 0 0"></a-entity>
  </a-entity>

</a-scene>

<script>
  const scene = document.querySelector('#scene');

  scene.addEventListener('loaded', () => {
    const canvas   = scene.canvas;
    const camera   = document.querySelector('a-camera');
    const gemEl    = document.querySelector('#gem-entity');
    const silverEl = document.querySelector('#silver-entity');
    const goldEl   = document.querySelector('#gold-entity');

    const raycaster = new THREE.Raycaster();

    function onTap(clientX, clientY) {
      const rect = canvas.getBoundingClientRect();

      // Normalised device coordinates
      const ndc = new THREE.Vector2(
        ((clientX - rect.left)  / rect.width)  * 2 - 1,
       -((clientY - rect.top)   / rect.height) * 2 + 1
      );

      const threeCamera = camera.getObject3D('camera');
      raycaster.setFromCamera(ndc, threeCamera);

      // Collect all meshes inside gem entity
      const meshes_gem = [];
      const meshes_silver = [];
      const meshes_gold = [];
      gemEl.object3D.traverse(obj => { if (obj.isMesh) meshes_gem.push(obj); });
      silverEl.object3D.traverse(obj => { if (obj.isMesh) meshes_silver.push(obj); });
      goldEl.object3D.traverse(obj => { if (obj.isMesh) meshes_gold.push(obj); });

      if (meshes_gem.length === 0) return; // model not loaded yet
      if (meshes_silver.length === 0) return; // model not loaded yet
      if (meshes_gold.length === 0) return; // model not loaded yet

      const hits_gems = raycaster.intersectObjects(meshes_gem, false);
      const hits_silvers = raycaster.intersectObjects(meshes_silver, false);
      const hits_golds = raycaster.intersectObjects(meshes_gold, false);

      if (hits_gems.length > 0) {
        gemEl.setAttribute('animation', {
          property: 'position',
          to: '0 0.1 0',
          dur: 1000,
          easing: 'easeInOutQuad'
        });
      }

      if (hits_silvers.length > 0) {
        silverEl.setAttribute('animation', {
          property: 'position',
          to: '0.15 0.3 0',
          dur: 1000,
          easing: 'easeInOutQuad'
        });
      }

      if (hits_golds.length > 0) {
        goldEl.setAttribute('animation', {
          property: 'position',
          to: '-0.2 -0.3 0',
          dur: 1000,
          easing: 'easeInOutQuad'
        });
      }
    }

    // Touch (iOS/Android)
    canvas.addEventListener('touchstart', e => {
      e.preventDefault();
      const t = e.touches[0];
      onTap(t.clientX, t.clientY);
    }, { passive: false });

    // Mouse (desktop testing)
    canvas.addEventListener('click', e => {
      onTap(e.clientX, e.clientY);
    });
  });
</script>

</body>
</html>
